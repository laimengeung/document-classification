# M2 - ResNet-50, ImageNet-pretrained, fine-tuned end to end.
# Fine-tuning strategy: differential learning rates (backbone 1e-4, new head 1e-3).
# M2 and M3 share every hyperparameter except the model, so the comparison is fair.
# Run:  python -m src.train --config configs/resnet50.yaml --tier main

run_name: null
seed: 42
deterministic: false

model:
  name: resnet50
  num_classes: 16
  in_chans: 3             # grayscale replicated to 3 channels for ImageNet weights
  pretrained: true

data:
  tier: main
  image_size: 224
  normalize:              # ImageNet statistics (PRD 5.1.4)
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  num_workers: 2

augment:
  enabled: true
  rotation_deg: 4
  translate: 0.03
  scale: 0.05
  brightness: 0.2
  contrast: 0.2
  blur_p: 0.3
  noise_p: 0.3
  noise_std: 0.03

train:
  epochs: 15
  batch_size: 64
  lr: 1.0e-4              # pretrained backbone
  head_lr: 1.0e-3         # freshly initialised 16-way classifier
  weight_decay: 0.01
  label_smoothing: 0.1
  warmup_epochs: 1
  amp: true
  grad_clip: 1.0
  early_stopping_patience: 4
  log_every: 50

paths:
  splits_dir: splits
  data_dir: data/working_copy
  output_dir: outputs
